<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Plern — logo options v2 (no purple box)</title>
<style>
  @font-face { font-family: "Noto Sans Thai"; src: local("Noto Sans Thai"); }
  body { margin: 0; background: #08080c; color: #eee;
         font-family: "Segoe UI", system-ui, "Noto Sans Thai", sans-serif; padding: 30px 34px; }
  h1 { font-size: 19px; margin: 0 0 4px; letter-spacing: -.01em; }
  p.sub { color: #8d8b9e; font-size: 12.5px; margin: 0 0 26px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 980px; }
  .card { border: 1px solid #1e1e2e; border-radius: 14px; padding: 20px 18px;
          display: flex; flex-direction: column; gap: 14px; background: #0d0d14; }
  .top { display: flex; align-items: center; gap: 12px; }
  .badge { background: #1d1d2c; color: #b9b6cf; border-radius: 6px; padding: 3px 9px;
           font-size: 11px; font-weight: 800; }
  .name { font-weight: 700; font-size: 13.5px; }
  .stage { display: flex; align-items: center; gap: 22px; padding: 16px 4px; }
  .sizes { display: flex; align-items: flex-end; gap: 16px; color: #6f6d80; font-size: 10.5px; }
  .sizes div { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .ctx { display: flex; align-items: center; gap: 10px; font-weight: 800;
         font-size: 17px; letter-spacing: -.02em; color: #fff; }
  .desc { color: #8d8b9e; font-size: 11.5px; line-height: 1.55; }
</style>
</head>
<body>
<h1>Plern — ตัวเลือกที่ 2 (ไม่มีกล่องพื้นหลัง)</h1>
<p class="sub">ทุกแบบเป็นเส้น/ตัวอักษรล้วน บนพื้นหลังจริงของแอป — ไม่มี gradient ไม่มีกรอบ</p>
<div class="grid" id="grid"></div>

<script>
const options = [
  ["A", "Thai พ", "อักษรไทย \"พ\" ตัวหนา — เอกลักษณ์เฉพาะ ใครเห็นก็รู้ว่าแอปไทย", `
    <text x="32" y="47" text-anchor="middle" font-size="46" font-weight="700"
          font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" fill="#fff">พ</text>`],

  ["B", "Waveform ring", "วงแหวนที่สร้างจากแท่งเสียง 12 แท่ง — รูปทรงเดียว ไม่มีกรอบ", `
    ${Array.from({length: 12}, (_, i) => {
      const a = (i * 30) * Math.PI / 180;
      const h = [7, 11, 15, 11][i % 4];
      const r1 = 20, r2 = 20 + h;
      const x1 = 32 + Math.cos(a) * r1, y1 = 32 + Math.sin(a) * r1;
      const x2 = 32 + Math.cos(a) * r2, y2 = 32 + Math.sin(a) * r2;
      return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}"
                    y2="${y2.toFixed(1)}" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>`;
    }).join("")}`],

  ["C", "Wordmark", "ตัวอักษร \"Plern\" ล้วน — ไม่มีไอคอน (สไตล์แบรนด์โมเดิร์น)", `
    <text x="32" y="42" text-anchor="middle" font-size="26" font-weight="800"
          letter-spacing="-1.4" font-family="Segoe UI, Inter, sans-serif" fill="#fff">Plern</text>
    <line x1="14" y1="50" x2="50" y2="50" stroke="#7c5cff" stroke-width="2.4" stroke-linecap="round"/>`],

  ["D", "Geometric P", "ตัว P จากสองเส้น + จุดโน้ต — เรขาคณิตล้วน", `
    <path d="M24 50V15M24 15h9a9.5 9.5 0 0 1 0 19H24" fill="none" stroke="#fff"
          stroke-width="4" stroke-linecap="square"/>
    <circle cx="45" cy="47" r="3.6" fill="#7c5cff"/>`],

  ["E", "Signal", "เส้นโค้ง 3 ชั้นเหมือนสัญญาณเสียง — เบา แต่จำง่าย", `
    <circle cx="20" cy="32" r="3.4" fill="#fff"/>
    <path d="M27 22a14 14 0 0 1 0 20" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M34 16a23 23 0 0 1 0 32" fill="none" stroke="#fff" stroke-opacity=".72" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M41 11a31 31 0 0 1 0 42" fill="none" stroke="#fff" stroke-opacity=".42" stroke-width="3.2" stroke-linecap="round"/>`],

  ["F", "Slash play", "สามเหลี่ยมเล่นที่ทำจากเส้นเฉียง 2 เส้น — ไม่มีพื้นหลัง", `
    <path d="M22 14L46 32 22 50" fill="none" stroke="#fff" stroke-width="5.2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M34 20L48 32 34 44" fill="none" stroke="#7c5cff" stroke-width="5.2"
          stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".9"/>`],
];

function svg(mark, size) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">${mark}</svg>`;
}

document.getElementById("grid").innerHTML = options.map(([key, name, desc, mark]) => `
  <div class="card">
    <div class="top"><span class="badge">${key}</span><span class="name">${name}</span></div>
    <div class="stage">
      ${svg(mark, 64)}
      <div class="sizes">
        <div>${svg(mark, 32)}<span>32</span></div>
        <div>${svg(mark, 22)}<span>22</span></div>
        <div>${svg(mark, 16)}<span>16</span></div>
      </div>
    </div>
    <div class="ctx">${svg(mark, 28)} Plern</div>
    <div class="desc">${desc}</div>
  </div>`).join("");
</script>
</body>
</html>
