{% extends "base.html" %}

{% block title %}{{ t('settings.title') }} — {{ app_name }}{% endblock %}

{% block content %}
<header class="page-hero">
  <span class="eyebrow">{{ t('settings.eyebrow') }}</span>
  <h1>{{ t('settings.title') }}</h1>
</header>

<nav class="settings-tabs">
  {% for item in tabs %}
    <a class="settings-tab {{ 'active' if tab == item.slug }}"
       href="{{ item.url }}">{{ t(item.label) }}</a>
  {% endfor %}
</nav>

{% block settings_content %}{% endblock %}
{% endblock %}
