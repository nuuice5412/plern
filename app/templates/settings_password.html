{% extends "settings_base.html" %}

{% block settings_content %}
<section class="settings-card">
  <h2>{{ t('password.title') }}</h2>

  <form method="post" class="form password-form">
    <label class="field">
      <span>{{ t('password.current') }}</span>
      <input type="password" name="current" required autocomplete="current-password">
    </label>

    <div class="field-row">
      <label class="field">
        <span>{{ t('password.new') }}</span>
        <input type="password" name="new" required minlength="8" autocomplete="new-password"
               placeholder="{{ t('password.hint') }}">
      </label>
      <label class="field">
        <span>{{ t('password.confirm') }}</span>
        <input type="password" name="confirm" required minlength="8" autocomplete="new-password">
      </label>
    </div>

    <div class="row-actions">
      <button class="btn btn-light" type="submit">{{ t('password.submit') }}</button>
      <a class="btn btn-ghost" href="{{ url_for('main.settings_tab', tab='account') }}">{{ t('edit.cancel') }}</a>
    </div>
  </form>
</section>
{% endblock %}
