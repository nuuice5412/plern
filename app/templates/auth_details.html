{% extends "base.html" %}

{% block title %}สร้างบัญชี — {{ app_name }}{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card auth-card-form">
    <div class="auth-brand">
      <span class="brand-mark">♪</span>
      <span>{{ app_name }}</span>
    </div>

    <h1>สร้างบัญชีของคุณ</h1>
    <p><strong>{{ email }}</strong></p>

    <form method="post" class="form">
      <div class="field-row">
        <label class="field">
          <span>ชื่อผู้ใช้</span>
          <input type="text" name="username" value="{{ form.get('username', '') }}"
                 required minlength="3" maxlength="50" autofocus
                 pattern="[A-Za-z0-9._\-]{3,50}"
                 title="a-z 0-9 . _ - ยาว 3-50 ตัว">
        </label>
        <label class="field">
          <span>รหัสผ่าน</span>
          <input type="password" name="password" required minlength="8"
                 autocomplete="new-password" placeholder="อย่างน้อย 8 ตัว">
        </label>
      </div>

      <div class="field">
        <span>วันเกิด</span>
        <div class="dob-row">
          <select name="day" aria-label="วัน" required>
            <option value="" disabled {{ 'selected' if not form.get('day') }}>วัน</option>
            {% for d in days %}
              <option value="{{ d }}" {{ 'selected' if form.get('day') == d|string }}>{{ d }}</option>
            {% endfor %}
          </select>
          <select name="month" aria-label="เดือน" required>
            <option value="" disabled {{ 'selected' if not form.get('month') }}>เดือน</option>
            {% for value, label in months %}
              <option value="{{ value }}" {{ 'selected' if form.get('month') == value|string }}>{{ label }}</option>
            {% endfor %}
          </select>
          <select name="year" aria-label="ปี" required>
            <option value="" disabled {{ 'selected' if not form.get('year') }}>ปี ค.ศ.</option>
            {% for y in years %}
              <option value="{{ y }}" {{ 'selected' if form.get('year') == y|string }}>{{ y }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="field-row">
        <label class="field">
          <span>เพศ</span>
          <select name="gender">
            {% for value, label in genders %}
              <option value="{{ value }}" {{ 'selected' if form.get('gender', '') == value }}>{{ label }}</option>
            {% endfor %}
          </select>
        </label>
        <label class="field">
          <span>ประเทศ</span>
          <select name="country">
            {% for value, label in countries %}
              <option value="{{ value }}" {{ 'selected' if form.get('country', 'TH') == value }}>{{ label }}</option>
            {% endfor %}
          </select>
        </label>
      </div>

      <label class="field">
        <span>เบอร์โทร <em>(ไม่บังคับ)</em></span>
        <input type="tel" name="tel" value="{{ form.get('tel', '') }}"
               placeholder="0812345678" maxlength="20">
      </label>

      <label class="check-row">
        <input type="checkbox" name="terms" required>
        <span>การสมัครถือว่าคุณได้อ่านและยอมรับ <strong>ข้อกำหนดการใช้งาน</strong>
          และ <strong>นโยบายความเป็นส่วนตัว</strong> แล้ว</span>
      </label>

      <button class="btn btn-lg btn-block btn-light" type="submit">สมัครสมาชิก</button>
    </form>

    <p class="muted small center" style="margin-top:14px">
      มีบัญชีอยู่แล้ว? <a class="link" href="{{ url_for('main.register') }}">ใช้อีเมลอื่น</a>
    </p>
    <p class="muted small center">
      <a class="link" href="{{ url_for('main.login') }}">เข้าสู่ระบบด้วยรหัสผ่าน</a>
    </p>
  </div>
</div>
{% endblock %}
